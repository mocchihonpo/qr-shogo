<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121512">
<title>QR照合ブザー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
/* Layout: phone app — top bar, one tab's content filling the screen, tab bar at the bottom (登録 / 比較 / 履歴) */
:root{
  --bg:#121512; --panel:#1c211c; --fg:#eef1ec; --muted:#9aa396; --line:#2f362f;
  --accent:#7fc8a2; --accent-fg:#0d1a12; --reg:#5e9ff0;
  --ok:#3fbf6a; --ng:#ef5b50; --idle:#3a423a;
  --s1:#3fbf6a; --s2:#5e9ff0; --s3:#bb85e0; --s4:#f0a040; --s5:#3cc7c7;
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
body{display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;font-weight:700;color:var(--fg);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.top h1{font-size:17px;margin:0}
.badge{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--idle)}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));gap:8px}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.cam{position:relative;flex:1;min-height:180px;border-radius:14px;overflow:hidden;background:#000}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.85);border-radius:14px;pointer-events:none;max-height:80%}
.cam .diag{position:absolute;left:0;right:0;bottom:0;padding:3px 8px;font:11px var(--f-code);color:#fff;background:rgba(0,0,0,.45)}
.cam .seen{position:absolute;left:8px;right:8px;top:8px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.65);color:#fff;font:700 13px var(--f-code);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.big{width:100%;min-height:54px;font-size:17px;background:var(--reg);color:#fff;border-color:var(--reg)}
.big:disabled{opacity:.45}
.cam .tap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.72);color:#fff;border:0;border-radius:0;font-size:20px;width:100%}
.cam .tap small{font-size:13px;font-weight:400;opacity:.85}
.status{border-radius:12px;padding:10px 12px;background:var(--idle);color:#fff;text-align:center;min-height:64px;display:flex;flex-direction:column;justify-content:center}
.status b{font-size:22px;line-height:1.25}
.status span{font-size:13px;opacity:.92;word-break:break-all}
.status.flash{animation:fl .3s ease-out}
@keyframes fl{from{transform:scale(1.04)}to{transform:scale(1)}}
.reglist{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;min-height:48px}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 6px;border-radius:10px;background:var(--panel);border:1.5px solid var(--line);font-size:13px;max-width:70%}
.chip .n{width:26px;height:26px;border-radius:7px;color:#fff;font:700 14px var(--f-code);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.chip .c{font-family:var(--f-code);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip button{min-height:28px;padding:0 8px;font-size:12px;border-radius:7px}
.empty{color:var(--muted);font-size:13px;align-self:center}
.row{display:flex;gap:8px}
.row button{flex:1}
.hist{flex:1;min-height:0;overflow-y:auto;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.hist .t{font-family:var(--f-code);color:var(--muted);font-variant-numeric:tabular-nums}
.hist .tag{font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;font-size:12px;white-space:nowrap}
.hist .c{font-family:var(--f-code);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.sum b{display:block;font:700 20px var(--f-code);color:var(--fg)}
.confirm{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--panel);border:1.5px solid var(--ng);border-radius:10px;padding:8px 10px;font-size:13px}
.confirm button{min-height:36px;padding:4px 12px}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:#0d100d;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;border-radius:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;min-height:58px;font-size:12px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}
nav button.on.reg{color:var(--reg)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.status.flash{animation:none}}
</style>
</head>
<body>
<div class="top">
  <h1>QR照合ブザー</h1>
  <span class="badge" id="badge">登録</span>
</div>

<main>
  <!-- 登録・比較で共通のカメラ画面 -->
  <section class="view" id="scanView">
    <div class="cam" id="cam">
      <video id="video" playsinline muted autoplay></video>
      <div class="frame"></div>
      <div class="seen" id="seen" hidden></div>
      <div class="diag" id="diag"></div>
      <button class="tap" id="tapStart">タップしてカメラ開始<small>音もここでオンになります</small></button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"><b id="sBig">準備中</b><span id="sSub"></span></div>

    <div id="regTools">
      <button class="big" id="regNow" disabled>QRを枠に入れてください</button>
      <div class="reglist" id="reglist" style="margin-top:8px"></div>
      <div class="row" style="margin-top:8px">
        <button id="toCompare">登録完了 → 比較へ</button>
        <button id="clearReg">登録を全部消す</button>
      </div>
      <div class="confirm" id="clearRegConfirm" hidden style="margin-top:8px">
        <span>登録をすべて消します</span>
        <span class="row"><button id="clearRegYes">消す</button><button id="clearRegNo">やめる</button></span>
      </div>
    </div>

    <div id="cmpTools" hidden>
      <div class="sum">
        <div>登録<b id="cReg">0</b></div>
        <div>一致<b id="cOk" style="color:var(--ok)">0</b></div>
        <div>不一致<b id="cNg" style="color:var(--ng)">0</b></div>
      </div>
    </div>
  </section>

  <!-- 履歴 -->
  <section class="view" id="histView" hidden>
    <div class="sum">
      <div>比較<b id="hAll">0</b></div>
      <div>一致<b id="hOk" style="color:var(--ok)">0</b></div>
      <div>不一致<b id="hNg" style="color:var(--ng)">0</b></div>
    </div>
    <ul class="hist" id="hist"></ul>
    <div class="row">
      <button id="csvBtn">CSVで保存</button>
      <button id="clearHist">履歴を消す</button>
    </div>
    <div class="confirm" id="clearHistConfirm" hidden>
      <span>履歴をすべて消します</span>
      <span class="row"><button id="clearHistYes">消す</button><button id="clearHistNo">やめる</button></span>
    </div>
  </section>
</main>

<nav>
  <button data-tab="reg" class="on reg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M12 8v8M8 12h8"/></svg>登録</button>
  <button data-tab="cmp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 12l3 3 5-6"/></svg>比較</button>
  <button data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>履歴</button>
</nav>

<script>
const $ = id => document.getElementById(id);
const COLORS = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)"];
const NAMES  = ["ピンポン","ピー","ピロリン","ポンポン","ピピピ"];
const KR = "qrbz-reg-v2", KH = "qrbz-hist-v2";
let reg = [], hist = [];
try{ reg = JSON.parse(localStorage.getItem(KR)||"[]"); if(!Array.isArray(reg)) reg=[]; }catch(e){ reg=[]; }
try{ hist = JSON.parse(localStorage.getItem(KH)||"[]"); if(!Array.isArray(hist)) hist=[]; }catch(e){ hist=[]; }
function saveReg(){ try{ localStorage.setItem(KR, JSON.stringify(reg)); }catch(e){} }
function saveHist(){ try{ localStorage.setItem(KH, JSON.stringify(hist.slice(0,500))); }catch(e){} }
const colorOf = i => COLORS[i % COLORS.length];

/* ---------- 音 ---------- */
let ac = null;
function audio(){ if(!ac){ const C = window.AudioContext||window.webkitAudioContext; if(C) ac = new C(); } if(ac && ac.state==="suspended") ac.resume(); return ac; }
function tone(f, st, d, type="sine", vol=.35){
  const a = audio(); if(!a) return;
  const t = a.currentTime+st, o = a.createOscillator(), g = a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.setValueAtTime(vol,t+d-.04); g.gain.linearRampToValueAtTime(0,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.02);
}
const MATCH = [
  ()=>{ tone(1047,0,.28,"sine",.4); tone(784,.3,.5,"sine",.4); },          // ピンポン
  ()=>{ tone(2000,0,.6,"square",.18); },                                  // ピー
  ()=>{ tone(784,0,.12); tone(988,.12,.12); tone(1319,.24,.3); },          // ピロリン
  ()=>{ tone(523,0,.15,"triangle",.5); tone(523,.22,.15,"triangle",.5); }, // ポンポン
  ()=>{ for(let k=0;k<3;k++) tone(1568,k*.13,.08,"square",.18); },         // ピピピ
];
const sMatch = i => MATCH[i % MATCH.length]();
const sReg  = () => tone(1800,0,.12,"square",.16);                         // 登録：ピッ
const sDup  = () => { tone(900,0,.07,"square",.12); tone(900,.12,.07,"square",.12); };
const sNG   = () => { tone(140,0,.7,"sawtooth",.3); tone(147,0,.7,"sawtooth",.22); };
const vib = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

/* ---------- 画面 ---------- */
let tab = "reg";
function status(bg, big, sub){
  const s = $("status"); s.style.background = bg;
  $("sBig").textContent = big; $("sSub").textContent = sub||"";
  s.classList.remove("flash"); void s.offsetWidth; s.classList.add("flash");
}
function idleStatus(){
  if (tab==="reg") status("var(--reg)", "登録モード", reg.length ? `${reg.length}件登録済み。伝票のQRをかざすと追加されます` : "伝票のQRをかざすと自動で登録されます");
  else status("var(--idle)", "比較モード", reg.length ? "品物のQRをかざしてください" : "まだ登録がありません。先に「登録」で伝票のQRを登録してください");
}
function renderReg(){
  const el = $("reglist");
  if (!reg.length){ el.innerHTML = `<span class="empty">登録はまだありません</span>`; }
  else {
    el.innerHTML = reg.map((c,i)=>`<div class="chip"><span class="n" style="background:${colorOf(i)}">${i+1}</span><span class="c"></span><button data-del="${i}" aria-label="${i+1}番を消す">×</button></div>`).join("");
    el.querySelectorAll(".chip .c").forEach((n,i)=> n.textContent = reg[i]);
  }
  $("cReg").textContent = reg.length;
}
function renderHist(){
  const ok = hist.filter(h=>h.r>=0).length, ng = hist.length-ok;
  $("hAll").textContent = hist.length; $("hOk").textContent = ok; $("hNg").textContent = ng;
  const ul = $("hist");
  if (!hist.length){ ul.innerHTML = `<li><span class="t">--:--</span><span class="tag" style="background:var(--idle)">なし</span><span class="c">比較するとここに残ります</span></li>`; return; }
  ul.innerHTML = hist.map(h=>`<li><span class="t"></span><span class="tag"></span><span class="c"></span></li>`).join("");
  [...ul.children].forEach((li,k)=>{
    const h = hist[k], d = new Date(h.t);
    li.children[0].textContent = `${d.getMonth()+1}/${d.getDate()} ${d.toTimeString().slice(0,8)}`;
    li.children[1].textContent = h.r>=0 ? `一致 ${h.r+1}番` : "不一致";
    li.children[1].style.background = h.r>=0 ? colorOf(h.r) : "var(--ng)";
    li.children[2].textContent = h.c;
  });
}
function sessionCounts(){
  $("cOk").textContent = sess.ok; $("cNg").textContent = sess.ng;
}
let sess = {ok:0, ng:0};

function setTab(t){
  tab = t;
  document.querySelectorAll("nav button").forEach(b=>{ b.classList.toggle("on", b.dataset.tab===t); b.classList.toggle("reg", b.dataset.tab==="reg"); });
  const scan = t!=="hist";
  $("scanView").hidden = !scan; $("histView").hidden = scan;
  $("regTools").hidden = t!=="reg"; $("cmpTools").hidden = t!=="cmp";
  $("badge").textContent = t==="reg" ? "登録" : t==="cmp" ? "比較" : "履歴";
  $("badge").style.background = t==="reg" ? "var(--reg)" : t==="cmp" ? "var(--accent)" : "var(--idle)";
  $("badge").style.color = t==="cmp" ? "var(--accent-fg)" : "#fff";
  lastCode = "";
  if (t==="hist") renderHist();
  if (t==="cmp"){ sess = {ok:0,ng:0}; sessionCounts(); }
  if (scan) idleStatus();
}

/* ---------- 読み取った時の処理 ---------- */
let lastCode = "", lastAt = 0;
function handle(code, fromCam){
  code = (code||"").trim(); if(!code) return;
  const now = Date.now();
  if (fromCam && code===lastCode && now-lastAt < 2500) return;   // 同じQRの連続反応を防ぐ
  lastCode = code; lastAt = now;
  if (tab==="reg"){
    const i = reg.indexOf(code);
    if (i>=0){ sDup(); vib(60); status("var(--s4)", `このQRは ${i+1}番に登録済みです`, "別の伝票のQRをかざしてください　"+code); return; }
    reg.push(code); saveReg(); renderReg();
    const n = reg.length-1;
    sReg(); vib(100);
    status(colorOf(n), `✓ ${n+1}番に登録しました`, `計${reg.length}件　${code}`);
    return;
  }
  if (tab==="cmp"){
    const i = reg.indexOf(code);
    hist.unshift({t:now, c:code, r:i}); saveHist();
    if (i>=0){ sMatch(i); vib(150); sess.ok++; status(colorOf(i), `一致　${i+1}番`, `${NAMES[i%NAMES.length]}　${code}`); }
    else { sNG(); vib([300,100,300]); sess.ng++; status("var(--ng)", "不一致", reg.length ? code : "登録がありません　"+code); }
    sessionCounts();
  }
}

/* ---------- QR解析 ---------- */
let detector = null;
try{ if ("BarcodeDetector" in window) detector = new BarcodeDetector({formats:["qr_code"]}); }catch(e){ detector = null; }
async function decodeCanvas(cv){
  if (detector){ try{ const r = await detector.detect(cv); if (r && r.length) return r[0].rawValue; }catch(e){} }
  if (window.jsQR){
    const d = cv.getContext("2d",{willReadFrequently:true}).getImageData(0,0,cv.width,cv.height);
    const r = jsQR(d.data, d.width, d.height, {inversionAttempts:"attemptBoth"});
    if (r) return r.data;
  }
  return null;
}

/* ---------- カメラ ---------- */
let stream = null, running = false, tries = 0, flip = false;
let seenCode = "", seenAt = 0;
function updateSeen(){
  const fresh = seenCode && Date.now()-seenAt < 1500;
  $("seen").hidden = !fresh;
  if (fresh) $("seen").textContent = "読めています：" + seenCode;
  const b = $("regNow");
  if (!fresh){ b.disabled = true; b.textContent = "QRを枠に入れてください"; return; }
  const i = reg.indexOf(seenCode);
  b.disabled = i>=0;
  b.textContent = i>=0 ? `このQRは ${i+1}番に登録済み` : `このQRを ${reg.length+1}番に登録する`;
}
const work = document.createElement("canvas");
async function startCam(){
  audio(); sReg();
  $("tapStart").hidden = true;
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});
  }catch(e){
    try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); }
    catch(e2){
      $("tapStart").hidden = false;
      $("tapStart").innerHTML = "カメラを使えませんでした<small>カメラの使用を「許可」にして、もう一度タップしてください</small>";
      return;
    }
  }
  const v = $("video"); v.srcObject = stream; await v.play().catch(()=>{});
  running = true; idleStatus(); loop();
}
async function loop(){
  if (!running) return;
  const v = $("video");
  if (!$("scanView").hidden && v.readyState>=2 && v.videoWidth){
    const W = v.videoWidth, H = v.videoHeight;
    let code = null;
    try{
      const ctx = work.getContext("2d",{willReadFrequently:true});
      if (flip){
        const cw = Math.round(Math.min(W,H)*.7), sx = Math.round((W-cw)/2), sy = Math.round((H-cw)/2), k = Math.min(1,900/cw);
        work.width = Math.round(cw*k); work.height = work.width;
        ctx.drawImage(v,sx,sy,cw,cw,0,0,work.width,work.height);
      } else {
        const k = Math.min(1,900/Math.max(W,H));
        work.width = Math.round(W*k); work.height = Math.round(H*k);
        ctx.drawImage(v,0,0,work.width,work.height);
      }
      flip = !flip;
      code = await decodeCanvas(work);
    }catch(e){}
    tries++;
    $("diag").textContent = `カメラ ${W}×${H}　解析 ${tries}回　${detector?"標準":"jsQR"}${(!detector&&!window.jsQR)?"（読込失敗）":""}`;
    if (code){ seenCode = code.trim(); seenAt = Date.now(); handle(code, true); }
    updateSeen();
  }
  setTimeout(loop, 120);
}
$("tapStart").onclick = startCam;
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && ac) ac.resume(); });

/* ---------- ボタン ---------- */
document.querySelectorAll("nav button").forEach(b=> b.onclick = ()=>{ audio(); setTab(b.dataset.tab); });
$("regNow").onclick = ()=>{ audio(); if (seenCode && Date.now()-seenAt < 1500){ lastCode=""; handle(seenCode,false); updateSeen(); } };
$("toCompare").onclick = ()=> setTab("cmp");
$("reglist").addEventListener("click", e=>{
  const b = e.target.closest("button[data-del]"); if(!b) return;
  reg.splice(+b.dataset.del,1); saveReg(); renderReg(); idleStatus();
});
$("clearReg").onclick = ()=> $("clearRegConfirm").hidden = false;
$("clearRegNo").onclick = ()=> $("clearRegConfirm").hidden = true;
$("clearRegYes").onclick = ()=>{ reg = []; saveReg(); renderReg(); $("clearRegConfirm").hidden = true; idleStatus(); };
$("clearHist").onclick = ()=> $("clearHistConfirm").hidden = false;
$("clearHistNo").onclick = ()=> $("clearHistConfirm").hidden = true;
$("clearHistYes").onclick = ()=>{ hist = []; saveHist(); renderHist(); $("clearHistConfirm").hidden = true; };
$("csvBtn").onclick = ()=>{
  const q = s => `"${String(s).replace(/"/g,'""')}"`;
  const rows = [["日時","結果","番号","QRの内容"]].concat(hist.map(h=>{
    const d = new Date(h.t);
    const ts = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.toTimeString().slice(0,8)}`;
    return [ts, h.r>=0?"一致":"不一致", h.r>=0?h.r+1:"", h.c];
  }));
  const csv = "﻿" + rows.map(r=>r.map(q).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  const d = new Date(); a.download = `照合履歴_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
};

renderReg(); setTab("reg");
